<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit commercial — Imagine Events Tunisia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     COCKPIT — feuille de style unique, pilotée par variables.
     Thème par défaut = charte Imagine Events
     (bleu #0B1D3A / rouge #C41E3A / blanc).
     Thème sombre d'origine disponible : <body class="theme-dark">
     ══════════════════════════════════════════════════════════════ */
  :root{
    --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Playfair Display",Georgia,"Times New Roman",serif;

    --navy:#0B1D3A; --navy-mid:#13294B; --navy-light:#1E4D8C;
    --bg:#F1F5F9; --panel:#FFFFFF; --surface:#FFFFFF; --surface2:#F8FAFC; --surface3:#FFFFFF;
    --line:#E2E8F0; --line2:#CBD5E1; --line3:#94A3B8;
    --hover:#EFF4FA; --navactive:#E8EFF8; --input:#FFFFFF; --well:#E8EFF8;
    --txt:#0F172A; --strong:#334155; --muted:#64748B; --muted2:#94A3B8;
    --accent:#C41E3A; --accent2:#E63946; --accent-deep:#A01830; --accent-ink:#FFFFFF;
    --accent-tint:#FDE8EC; --accent-tintline:#F5C2CB; --accent-soft:rgba(196,30,58,.10);
    --ok:#16A34A; --warn:#D97706; --bad:#DC2626; --dead:#F5C2CB;
    --ok-soft:#DCFCE7; --warn-soft:#FEF3C7; --bad-soft:#FEE2E2;
    --btn:#F1F5F9; --btn-hover:#E2E8F0;
    --toast:#0B1D3A; --toast-txt:#FFFFFF;
    --shadow:0 1px 3px rgba(11,29,58,.06), 0 8px 24px rgba(11,29,58,.05);
    --shadow-lg:0 18px 48px rgba(11,29,58,.18);
  }
  /* Thème sombre d'origine (facultatif) : ?theme=dark */
  body.theme-dark{
    --bg:#0B0B0E; --panel:#111116; --surface:#15151B; --surface2:#101016; --surface3:#191920;
    --line:#23232B; --line2:#2C2C36; --line3:#4A4A57;
    --hover:#17171E; --navactive:#1B1B22; --input:#101016; --well:#0E0E13;
    --txt:#ECECE8; --strong:#B6B6C0; --muted:#8E8E99; --muted2:#6E6E79;
    --accent:#C9A227; --accent2:#E4C25A; --accent-deep:#8A6B12; --accent-ink:#141007;
    --accent-tint:#1A1709; --accent-tintline:#3A3116; --accent-soft:rgba(201,162,39,.12);
    --ok:#3FBF87; --warn:#E0913A; --bad:#E0605A; --dead:#4A2E2E;
    --ok-soft:#14211B; --warn-soft:#221D14; --bad-soft:#241718;
    --btn:#1C1C24; --btn-hover:#23232D;
    --toast:#1E1E26; --toast-txt:#ECECE8;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --shadow-lg:0 18px 48px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; letter-spacing:.01em; margin:0; color:var(--txt)}
  a{color:var(--accent); text-decoration:none}
  .app{display:flex; min-height:100vh}

  /* ---------- SIDEBAR ---------- */
  aside{
    width:246px; flex:0 0 246px; background:var(--panel); border-right:1px solid var(--line);
    padding:22px 14px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;flex:0 0 34px;
    background:linear-gradient(135deg,var(--accent2),var(--accent-deep));
    display:grid;place-items:center;color:var(--accent-ink);font-family:var(--font-display);font-weight:700;font-size:17px;
  }
  .brand b{display:block;font-family:var(--font-display);font-size:15px;letter-spacing:.02em}
  .brand span{display:block;font-size:10.5px;color:var(--muted2);letter-spacing:.14em;text-transform:uppercase}
  nav{display:flex;flex-direction:column;gap:2px}
  nav .navlabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);padding:0 10px 8px}
  nav a{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--strong);
    font-size:13.5px;border-left:2px solid transparent;
  }
  nav a .ico{width:16px;text-align:center;opacity:.85;font-size:13px}
  nav a:hover{background:var(--hover);color:var(--txt)}
  nav a.active{background:var(--navactive);color:var(--txt);border-left:2px solid var(--accent)}
  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
  .sidebar-foot .tiny{font-size:10.5px;color:var(--muted2);line-height:1.45;padding:0 6px}
  .ghostbtn{
    background:transparent;border:1px solid var(--line2);color:var(--strong);border-radius:8px;
    padding:7px 10px;font-size:12px;cursor:pointer;text-align:left;font-family:inherit;
  }
  .ghostbtn:hover{border-color:var(--accent);color:var(--txt)}

  /* ---------- MAIN ---------- */
  main{flex:1; min-width:0; padding:30px 34px 70px; max-width:1320px}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .pagehead h1{font-size:27px}
  .pagehead p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:640px}
  .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-family:var(--font-display);font-size:26px;margin-top:6px;letter-spacing:.01em;color:var(--navy)}
  body.theme-dark .kpi .val{color:var(--txt)}
  .kpi .sub{font-size:11.5px;color:var(--muted2);margin-top:3px}
  .kpi.accent{border-color:var(--accent-tintline);background:linear-gradient(180deg,var(--accent-tint),var(--surface))}

  .cols{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}
  @media(max-width:1080px){.cols{grid-template-columns:1fr}}
  .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
  .cardhead h3{font-size:16px}
  .cardhead .hint{font-size:11.5px;color:var(--muted)}

  /* buttons */
  .btn{
    font-family:inherit;font-size:12.5px;padding:8px 13px;border-radius:9px;cursor:pointer;
    background:var(--btn);color:var(--txt);border:1px solid var(--line2);white-space:nowrap;
  }
  .btn:hover{border-color:var(--line3);background:var(--btn-hover)}
  .btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:var(--accent-deep);font-weight:600}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.mini{padding:5px 9px;font-size:11.5px}
  .btn.danger{color:var(--bad);border-color:var(--accent-tintline);background:transparent}
  .btn.danger:hover{border-color:var(--bad);background:var(--bad-soft)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}

  /* inputs */
  input,select,textarea{
    font-family:inherit;font-size:13px;background:var(--input);color:var(--txt);
    border:1px solid var(--line2);border-radius:9px;padding:8px 11px;width:100%;outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;line-height:1.55}
  label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .field{margin-bottom:12px}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media(max-width:640px){.formgrid{grid-template-columns:1fr}}
  .full{grid-column:1/-1}

  /* lists */
  .rowlist{display:flex;flex-direction:column;gap:9px}
  .item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:0 0 7px;background:var(--accent)}
  .item .dot.late{background:var(--bad)}
  .item .dot.done{background:var(--ok)}
  .item .txt{flex:1;min-width:0}
  .item .t1{font-size:13.5px}
  .item .t2{font-size:11.5px;color:var(--muted);margin-top:2px}
  .badge{font-size:10.5px;padding:2.5px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--strong);background:var(--surface2);white-space:nowrap}
  .badge.late{color:var(--bad);border-color:var(--accent-tintline);background:var(--bad-soft)}
  .badge.soon{color:var(--warn);border-color:#FDE68A;background:var(--warn-soft)}
  .badge.ok{color:var(--ok);border-color:#BBF7D0;background:var(--ok-soft)}
  body.theme-dark .badge.soon{border-color:var(--accent-tintline)}
  body.theme-dark .badge.ok{border-color:#234434}
  .empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}

  /* barres de progression */
  .bar{height:6px;background:var(--well);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-deep),var(--accent2))}
  .bar.ok>i{background:var(--ok)}
  .bar.dead>i{background:var(--dead)}
  .barline{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}

  /* helpers */
  .t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)} .t-accent{color:var(--accent)}
  .body-text{color:var(--strong);line-height:1.75}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .sep{height:1px;background:var(--line);margin:18px 0}
  code{background:var(--accent-tint);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--accent-deep)}
  body.theme-dark code{color:var(--accent2)}

  /* kanban */
  .kanban{display:grid;grid-template-columns:repeat(6,minmax(182px,1fr));gap:10px;overflow-x:auto;padding-bottom:12px}
  .col{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:11px;min-height:180px}
  .col h4{margin:0 0 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;font-family:var(--font-body);font-weight:700}
  .col h4 span{color:var(--muted2)}
  .col[data-stage="signe"] h4{color:var(--ok)}
  .col[data-stage="perdu"] h4{color:var(--muted2)}
  .leadcard{background:var(--surface3);border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:var(--shadow)}
  .leadcard .co{font-size:13px;font-weight:700;letter-spacing:.01em}
  .leadcard .ev{font-size:11.5px;color:var(--muted);margin-top:2px}
  .leadcard .amt{font-family:var(--font-display);font-size:14.5px;color:var(--accent);margin-top:6px}
  .leadcard .meta{font-size:10.5px;color:var(--muted2);margin-top:5px;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .leadcard .mini-actions{display:flex;gap:4px;margin-top:9px;opacity:.6}
  .leadcard:hover .mini-actions{opacity:1}
  .leadcard .mini-actions button{
    flex:1;background:var(--btn);border:1px solid var(--line2);color:var(--strong);border-radius:6px;
    font-size:11px;padding:3px 0;cursor:pointer;font-family:inherit;
  }
  .leadcard .mini-actions button:hover{color:var(--txt);border-color:var(--line3);background:var(--btn-hover)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 8px 9px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td input,td select{padding:6px 8px;font-size:12.5px}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .totals{display:grid;grid-template-columns:1fr auto;gap:6px 18px;max-width:400px;margin-left:auto;margin-top:14px;font-size:13px}
  .totals .k{color:var(--muted)}
  .totals .v{text-align:right;font-variant-numeric:tabular-nums}
  .totals .grand{border-top:1px solid var(--line2);padding-top:8px;margin-top:4px;font-family:var(--font-display);font-size:16px;color:var(--navy)}
  body.theme-dark .totals .grand{color:var(--txt)}
  .totals .grand .v{color:var(--accent)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chip{font-size:11.5px;padding:5px 10px;border-radius:99px;border:1px dashed var(--line2);color:var(--strong);cursor:pointer;background:transparent;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:var(--accent);border-style:solid}

  .proposal{
    background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:20px 22px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.3px;line-height:1.65;
    white-space:pre-wrap;max-height:540px;overflow:auto;color:var(--txt);
  }
  .tpl{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px}
  .tpl h4{margin:0 0 4px;font-size:13px;font-family:var(--font-body);letter-spacing:.02em;color:var(--txt)}
  .tpl .when{font-size:11px;color:var(--accent);margin-bottom:8px;font-weight:600}
  .tpl pre{white-space:pre-wrap;font-family:inherit;font-size:12.5px;color:var(--strong);margin:0 0 10px;line-height:1.55}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(11,29,58,.55);display:grid;place-items:center;padding:20px;z-index:60;backdrop-filter:blur(2px)}
  body.theme-dark .overlay{background:rgba(6,6,9,.72)}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px;box-shadow:var(--shadow-lg)}
  .modal h3{font-size:18px;margin-bottom:16px}
  .modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--toast);border:1px solid var(--line2);color:var(--toast-txt);padding:10px 18px;border-radius:99px;
    font-size:12.5px;opacity:0;transition:.25s;z-index:90;pointer-events:none;box-shadow:var(--shadow-lg);
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .banner{
    background:var(--accent-tint);border:1px solid var(--accent-tintline);color:var(--accent-deep);border-radius:11px;
    padding:10px 14px;font-size:12px;margin-bottom:18px;display:none;
  }
  body.theme-dark .banner{color:#E2CF9A}
  .banner.on{display:block}

  /* ---------- MODE EMBARQUÉ (intégration dans Imagine Inventory) ---------- */
  .embedbar{display:none}
  #embednav{display:none}
  body.embed{background:transparent}
  body.embed aside{display:none}
  body.embed .app{min-height:0}
  body.embed #embednav{
    display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:20;
  }
  body.embed #embednav a{font-size:12.5px;padding:6px 11px;border-radius:8px;color:var(--strong);border:1px solid transparent;font-weight:600}
  body.embed #embednav a:hover{background:var(--hover)}
  body.embed #embednav a.active{background:var(--accent-tint);color:var(--accent-deep);border-color:var(--accent-tintline)}
  body.embed main{padding:18px 18px 44px;max-width:none}
  body.embed .pagehead h1{font-size:23px}
  body.embed .banner{display:none!important}

  @media(max-width:860px){
    .app{flex-direction:column}
    aside{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:12px}
    .sidebar-foot{display:none}
    nav{flex-direction:row;gap:4px}
    nav .navlabel{display:none}
    main{padding:20px 16px 60px}
    .kanban{grid-template-columns:repeat(6,minmax(190px,1fr))}
  }
  @media print{
    aside,.pagehead .actions,.banner,.sidebar-foot,#embednav{display:none!important}
    body{background:#fff;color:#000}
    .card,.proposal{border-color:#ccc;background:#fff;color:#000;max-height:none;box-shadow:none}
    main{padding:0}
  }
</style>
</head>
<body>
<div id="embednav"></div>
<div class="app">
  <aside>
    <div class="brand">
      <div class="mark">I</div>
      <div><b>Imagine</b><span>Cockpit commercial</span></div>
    </div>
    <nav id="nav">
      <div class="navlabel">Pilotage</div>
      <a href="#cockpit" data-route="cockpit"><span class="ico">◎</span>Cockpit</a>
      <a href="#pipeline" data-route="pipeline"><span class="ico">▤</span>Pipeline leads</a>
      <div class="navlabel" style="padding-top:14px">Commercial</div>
      <a href="#devis" data-route="devis"><span class="ico">∑</span>Devis & marges</a>
      <a href="#proposition" data-route="proposition"><span class="ico">✎</span>Proposition</a>
      <div class="navlabel" style="padding-top:14px">Croissance</div>
      <a href="#acquisition" data-route="acquisition"><span class="ico">↗</span>Acquisition</a>
      <a href="#plan" data-route="plan"><span class="ico">◈</span>Plan 90 jours</a>
    </nav>
    <div class="sidebar-foot">
      <button class="ghostbtn" data-action="export">↓ Sauvegarder (JSON)</button>
      <button class="ghostbtn" data-action="import">↑ Restaurer</button>
      <button class="ghostbtn" data-action="exportCsv">↓ Leads (CSV)</button>
      <div class="tiny" id="storeinfo"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<input type="file" id="fileinput" accept=".json" style="display:none">
<div class="toast" id="toast"></div>
<div id="modalhost"></div>

<script>
"use strict";
/* =========================================================
   COCKPIT AGENCE — outil interne mono-fichier
   Données : localStorage (repli mémoire si l'aperçu bloque)
   ========================================================= */

/* ---------- storage shim ---------- */
const store = (function(){
  let mem = {}, ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    persistent: ok,
    get(k, d){ try{ const raw = ok ? localStorage.getItem(k) : mem[k]; return raw ? JSON.parse(raw) : d; }catch(e){ return d; } },
    set(k, v){ const s = JSON.stringify(v); if(ok){ try{ localStorage.setItem(k, s); }catch(e){} } else { mem[k] = s; } }
  };
})();

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const frDate = iso => { if(!iso) return '—'; const [y,m,d] = iso.split('-'); return d+'/'+m+'/'+y; };
const fmt = n => Math.round(Number(n)||0).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g,' ');
const money = n => fmt(n) + ' TND';
const pct = n => (Math.round((Number(n)||0)*1000)/10).toFixed(1).replace('.0','') + ' %';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysFromToday = iso => {
  if(!iso) return null;
  const t = new Date(iso+'T00:00:00'), n = new Date(todayISO()+'T00:00:00');
  return Math.round((n - t)/86400000); // >0 = en retard
};
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ---------- paramètres d'intégration ----------
   ?embed=1          → masque la barre latérale, affiche une barre d'onglets
   ?accent=%23c9a227 → couleur d'accent de votre charte
   ?api=https://...  → synchronise sur la base de votre site au lieu du localStorage
   ------------------------------------------------------ */
const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.has('embed');
const REMOTE_API = (PARAMS.get('api') || '').replace(/\/+$/, '');
if (EMBED) document.body.classList.add('embed');
if (PARAMS.get('accent')) {
  document.documentElement.style.setProperty('--accent', PARAMS.get('accent'));
  document.documentElement.style.setProperty('--accent2', PARAMS.get('accent'));
}

/* ---------- calculs ---------- */
const activeLead = l => l.stage !== 'signe' && l.stage !== 'perdu';
function kpis(){
  const actives = state.leads.filter(activeLead);
  const signed = state.leads.filter(l=>l.stage==='signe');
  const lost = state.leads.filter(l=>l.stage==='perdu');
  const closeRate = (signed.length + lost.length) ? signed.length/(signed.length+lost.length) : 0;
  const caSigne = signed.reduce((s,l)=>s+Number(l.valeur||0),0);
  const weighted = actives.reduce((s,l)=>s+Number(l.valeur||0)*stageOf(l.stage).prob,0);
  const late = state.leads.filter(l=>l.nextDate && daysFromToday(l.nextDate)>0 && activeLead(l));
  const today = state.leads.filter(l=>l.nextDate && daysFromToday(l.nextDate)===0 && activeLead(l));
  return {actives, signed, lost, closeRate, caSigne, weighted, late, today, total:state.leads.length};
}

function stageBadge(stage){
  const s = stageOf(stage);
  const cls = stage==='signe' ? 'ok' : stage==='perdu' ? 'late' : '';
  return `<span class="badge ${cls}">${s.label}</span>`;
}

function newDraft(){
  return {id:uid(), client:'', event:'', date:'', pax:'', remise:0, tva:Number(state.profile.tva||19), lines:[], created:todayISO()};

function lineTotals(l){
  const qty = Number(l.qty)||0, cost = Number(l.cost)||0, coef = Number(l.coef)||0;
  const unitSale = cost*coef;
  return {cost: qty*cost, sale: qty*unitSale, unitSale};
}
function draftTotals(d){
  const cost = d.lines.reduce((a,l)=>a+lineTotals(l).cost,0);
  const sale = d.lines.reduce((a,l)=>a+lineTotals(l).sale,0);
  const marge = sale - cost;
  const margePct = sale>0 ? marge/sale : 0;
  const remise = sale * (Number(d.remise)||0)/100;
  const htNet = sale - remise;
  const tva = htNet * (Number(d.tva)||0)/100;
  return {cost, sale, marge, margePct, remise, htNet, tva, ttc: htNet + tva};
}

function route(){
  const h = (location.hash || '#cockpit').slice(1);
  const [base, arg] = h.split('/');
  const main = $('#main');
  const map = {cockpit:viewCockpit, pipeline:viewPipeline, devis:viewDevis, proposition:viewProposition, acquisition:viewAcquisition, plan:viewPlan};
  if(base==='devis' && arg){ main.innerHTML = viewDevisEditor(arg); draft = draft && draft.id===arg ? draft : (state.devis.find(d=>d.id===arg) ? JSON.parse(JSON.stringify(state.devis.find(d=>d.id===arg))) : newDraft()); if(!state.devis.find(d=>d.id===arg)) draft.id = arg; }
  else if(map[base]) main.innerHTML = map[base]();
  else main.innerHTML = viewCockpit();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===base));
  window.scrollTo(0,0);
  const si = $('#storeinfo');
  if(si) si.innerHTML = REMOTE_API ? 'Synchronisé avec votre site'
    : store.persistent ? 'Sauvegarde locale active'
    : 'Aperçu : données non persistées. Téléchargez le fichier et ouvrez-le dans un onglet.';
  const b = $('.banner'); if(b) b.classList.toggle('on', !store.persistent && !REMOTE_API);

  const eb = $('#embednav');
  if(eb && EMBED){
    eb.innerHTML = [['cockpit','Cockpit'],['pipeline','Pipeline'],['devis','Devis'],['proposition','Proposition'],['acquisition','Acquisition'],['plan','Plan 90 j']]
      .map(([r,l]) => `<a href="#${r}" class="${base===r?'active':''}">${l}</a>`).join('');
  }
  postHeight();
}
/* hauteur communiquée au site hôte (iframe auto-dimensionnée) */
function postHeight(){
  if(window.parent === window) return;
  try {
    setTimeout(()=>{
      window.parent.postMessage({type:'cockpit-height', height: Math.ceil(document.documentElement.scrollHeight)}, '*');
    }, 80);
  } catch(e){}
}
window.addEventListener('resize', postHeight);
window.addEventListener('message', e => {
  if(e.data && e.data.type === 'cockpit-set'){ state.leads = e.data.leads || state.leads; store.set('leads', state.leads); route(); }
});
window.addEventListener('hashchange', route);

   ========================================================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;

  if(a==='new-lead'){ openLeadModal(null); }
  if(a==='edit-lead'){ openLeadModal(t.dataset.id); }
  if(a==='move'){
    const l = state.leads.find(x=>x.id===t.dataset.id);
    if(!l) return;
    const i = STAGES.findIndex(s=>s.id===l.stage);
    const j = Math.min(STAGES.length-1, Math.max(0, i + Number(t.dataset.dir)));
    l.stage = STAGES[j].id;
    save(); route();
  }
  if(a==='new-devis'){ draft = newDraft(); location.hash = '#devis/'+draft.id; route(); }
  if(a==='open-devis'){ draft = JSON.parse(JSON.stringify(state.devis.find(d=>d.id===t.dataset.id) || newDraft())); location.hash = '#devis/'+draft.id; route(); }
  if(a==='back-devis'){ draft = null; location.hash = '#devis'; }
  if(a==='add-line'){
    const p = LINE_PRESETS[Number(t.dataset.i)];
    draft.lines.push({label:p.label, cat:p.cat, qty:1, cost:0, coef:p.coef});
    refreshDevis();
  }
  if(a==='del-line'){ draft.lines.splice(Number(t.dataset.i),1); refreshDevis(); }
  if(a==='save-devis'){
    const i = state.devis.findIndex(d=>d.id===draft.id);
    const copy = JSON.parse(JSON.stringify(draft));
    if(i>=0) state.devis[i] = copy; else state.devis.push(copy);
    save(); toast('Devis enregistré'); location.hash = '#devis';
  }
  if(a==='devis-to-proposal'){
    const t2 = draftTotals(draft);
    state.proposal = Object.assign({}, state.proposal, {
      client: draft.client, event: draft.event, date: draft.date,
      pax: draft.pax, budget: Math.round(t2.htNet)
    });
    save(); toast('Proposition pré-remplie depuis le devis'); location.hash = '#proposition';
  }
  if(a==='copy-proposal'){ copyText(buildProposal(state.proposal), 'Proposition copiée'); }
  if(a==='print'){ window.print(); }
  if(a==='mail-proposal'){
    const p = state.proposal;
    const sub = encodeURIComponent('Proposition — '+(p.event||'votre événement'));
    const body = encodeURIComponent(buildProposal(p));
    window.location.href = 'mailto:?subject='+sub+'&body='+body;
  }
  if(a==='copy-tpl'){
    const tpl = TEMPLATES[Number(t.dataset.i)];
    const contact = ($('#tplContact') && $('#tplContact').value.trim()) || '[contact]';
    const societe = ($('#tplSociete') && $('#tplSociete').value.trim()) || '[société]';
    const txt = tpl.body.replace(/\{contact\}/g, contact).replace(/\{societe\}/g, societe).replace(/\{evenement\}/g, 'votre événement');
    copyText(txt, 'Message copié');
  }
  if(a==='toggle-content'){
    const i = Number(t.dataset.i);
    const arr = state.content || [];
    const k = arr.indexOf(i);
    if(k>=0) arr.splice(k,1); else arr.push(i);
    state.content = arr; save();
    const item = t.closest('.item'); const title = item.querySelector('.t1');
    if(title) title.style.cssText = k>=0 ? '' : 'text-decoration:line-through;opacity:.55';
  }
  if(a==='export'){ download('cockpit-agence-'+todayISO()+'.json', JSON.stringify(state,null,2), 'application/json'); }
  if(a==='exportCsv'){
    const head = ['societe','contact','secteur','evenement','pax','valeur','source','stage','next','nextDate','notes'];
    const csv = [head.join(';')].concat(state.leads.map(l=>head.map(h=>'"'+String(l[h]==null?'':l[h]).replace(/"/g,'""')+'"').join(';'))).join('\n');
    download('leads-'+todayISO()+'.csv', '\ufeff'+csv, 'text/csv');
  }
  if(a==='import'){ $('#fileinput').click(); }
  if(a==='modal-close'){ closeModal(); }
});

document.addEventListener('input', e=>{

  if(el.dataset && el.dataset.dfield!==undefined && draft){
    const k = el.dataset.dfield;
    draft[k] = el.value;
    if(k==='remise' || k==='tva'){ const tot = $('#totals'); if(tot) tot.innerHTML = totalsHTML(draft); }
    return;
  }
  if(el.dataset && el.dataset.line!==undefined && draft){
    const i = Number(el.dataset.line), k = el.dataset.k;
    draft.lines[i][k] = el.value;
    const t = lineTotals(draft.lines[i]);
    const pv = document.querySelector('[data-cell="pv-'+i+'"]');
    const tot = document.querySelector('[data-cell="tot-'+i+'"]');
    if(pv) pv.textContent = fmt(t.unitSale);
    if(tot) tot.textContent = fmt(t.sale);
    const tt = $('#totals'); if(tt) tt.innerHTML = totalsHTML(draft);
    return;
  }
  if(el.dataset && el.dataset.pfield!==undefined){
    state.proposal[el.dataset.pfield] = el.value;
    save();
    const pt = $('#proposalText'); if(pt) pt.textContent = buildProposal(state.proposal);
    return;
  }
  if(el.id==='search'){
    const q = el.value.toLowerCase().trim();
    document.querySelectorAll('.leadcard').forEach(c=>{
      c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }

/* film picker */
document.addEventListener('change', e=>{
  if(e.target.id==='fileinput' && e.target.files && e.target.files[0]){
    const f = e.target.files[0];
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(d.leads) state.leads = d.leads;
        if(d.devis) state.devis = d.devis;
        if(d.proposal) state.proposal = d.proposal;
        if(d.content) state.content = d.content;
        if(d.profile) state.profile = d.profile;
        save(); toast('Données restaurées'); route();
      }catch(err){ toast('Fichier invalide'); }
    };
    r.readAsText(f);
    e.target.value = '';
  }
});

/* ---------- modal lead ---------- */
function openLeadModal(id){
  const l = id ? JSON.parse(JSON.stringify(state.leads.find(x=>x.id===id))) : {id:uid(), societe:'', contact:'', secteur:'', evenement:'', pax:'', valeur:'', source:'', stage:'nouveau', next:'', nextDate:'', notes:''};
  const opts = STAGES.map(s=>`<option value="${s.id}" ${l.stage===s.id?'selected':''}>${s.label}</option>`).join('');
  const srcs = ['Recommandation','LinkedIn','Appel entrant','Salon','Site web','Partenaire hôtel','Traiteur','Autre'];
  $('#modalhost').innerHTML = `<div class="overlay"><div class="modal">
    <h3>${id?'Modifier le lead':'Nouveau lead'}</h3>
    <div class="formgrid">
      <div class="field"><label>Société *</label><input id="m-societe" value="${esc(l.societe)}"></div>
      <div class="field"><label>Contact</label><input id="m-contact" value="${esc(l.contact)}"></div>
      <div class="field"><label>Secteur</label><input id="m-secteur" value="${esc(l.secteur)}"></div>
      <div class="field"><label>Type d'événement</label><input id="m-evenement" value="${esc(l.evenement)}" placeholder="Séminaire annuel 300 pax"></div>
      <div class="field"><label>Participants</label><input id="m-pax" type="number" value="${esc(l.pax)}"></div>
      <div class="field"><label>Valeur estimée (TND)</label><input id="m-valeur" type="number" value="${esc(l.valeur)}"></div>
      <div class="field"><label>Source</label><select id="m-source">${srcs.map(s=>`<option ${l.source===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Étape</label><select id="m-stage">${opts}</select></div>
      <div class="field full"><label>Prochaine action</label><input id="m-next" value="${esc(l.next)}" placeholder="Appeler pour valider le lieu"></div>
      <div class="field full"><label>Date de la prochaine action</label><input id="m-nextDate" type="date" value="${esc(l.nextDate)}"></div>
      <div class="field full"><label>Notes</label><textarea id="m-notes" rows="2">${esc(l.notes)}</textarea></div>
    </div>
    <div class="foot">
      ${id?`<button class="btn danger" data-action="modal-delete" data-id="${l.id}">Supprimer</button>`:''}
      <button class="btn" data-action="modal-close">Annuler</button>
      <button class="btn primary" data-action="modal-save" data-id="${l.id}">Enregistrer</button>
    </div>
  </div></div>`;
  $('#modalhost').querySelector('[data-action="modal-save"]').addEventListener('click', ()=>{
    const val = k => ($('#m-'+k) ? $('#m-'+k).value : '');
    if(!val('societe').trim()){ toast('Le nom de la société est obligatoire'); return; }
    const obj = {
      id:l.id, societe:val('societe').trim(), contact:val('contact'), secteur:val('secteur'),
      evenement:val('evenement'), pax:val('pax'), valeur:Number(val('valeur'))||0,
      source:val('source'), stage:val('stage'), next:val('next'), nextDate:val('nextDate'), notes:val('notes')
    };
    const i = state.leads.findIndex(x=>x.id===l.id);
    if(i>=0) state.leads[i] = obj; else state.leads.push(obj);
    save(); closeModal(); route(); toast('Lead enregistré');
  });
  $('#modalhost').querySelector('[data-action="modal-delete"]')?.addEventListener('click', ev=>{
    state.leads = state.leads.filter(x=>x.id!==ev.target.dataset.id);
    save(); closeModal(); route(); toast('Lead supprimé');
  });
  $('#modalhost').querySelector('.overlay').addEventListener('click', ev=>{ if(ev.target.classList.contains('overlay')) closeModal(); });
  const f = $('#m-societe'); if(f) f.focus();
}
function closeModal(){ $('#modalhost').innerHTML = ''; }

/* ---------- clipboard & download ---------- */
function copyText(txt, msg){
  const done = () => toast(msg||'Copié');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copie bloquée : sélectionnez le texte manuellement'); }
    document.body.removeChild(ta);
  }
}
function download(name, content, type){
  const b = new Blob([content], {type:type||'text/plain;charset=utf-8'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u), 1000);
  toast('Fichier téléchargé');
}

/* ---------- init ---------- */
async function bootstrap(){
  if (REMOTE_API) {
    try {
      const r = await fetch(REMOTE_API + '/state', {credentials:'include'});
      if (r.ok) {
        const d = await r.json();
        if (d && typeof d === 'object') {
          if (Array.isArray(d.leads)) state.leads = d.leads;
          if (Array.isArray(d.devis)) state.devis = d.devis;
          if (d.proposal && typeof d.proposal === 'object') state.proposal = Object.assign({}, state.proposal, d.proposal);
          if (Array.isArray(d.content)) state.content = d.content;
          if (d.profile && typeof d.profile === 'object') state.profile = Object.assign({}, state.profile, d.profile);
          store.set('leads', state.leads); store.set('devis', state.devis);
        }
      }
    } catch(e) { /* repli : données locales */ }
  }
  route();
}
bootstrap();
</script>
