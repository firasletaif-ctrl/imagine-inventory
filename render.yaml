services:
  - type: web
    name: imagine-inventory
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: imagine-events-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: imagine-events-db
    plan: free
