<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagine Events</title>
<style>
  body{margin:0;background:#0B1D3A;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{text-align:center;padding:2rem}
  .box img{height:80px;margin-bottom:1.2rem}
  .box p{color:rgba(255,255,255,.7);font-size:.9rem;margin:0}
  .spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#E63946;border-radius:50%;margin:1.5rem auto 0;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <p style="font-size:1.1rem;font-weight:bold">Imagine Events — Gestion du dépôt</p>
  <p>Ouverture de l'application…</p>
  <div class="spin"></div>
</div>
</body>
</html>
