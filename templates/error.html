<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Oups — Imagine Inventory</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',Arial,sans-serif;background:linear-gradient(135deg,#0B1D3A,#13294B);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;color:#fff}
  .card{background:#fff;color:#1E293B;border-radius:16px;padding:2.5rem 2rem;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .icon{font-size:3.5rem;margin-bottom:.75rem}
  h1{font-family:Georgia,serif;font-size:1.5rem;color:#0B1D3A;margin-bottom:.5rem}
  p{color:#64748B;font-size:.95rem;line-height:1.6;margin-bottom:1.25rem}
  button{background:#C41E3A;color:white;border:none;padding:13px 34px;font-size:1rem;border-radius:8px;cursor:pointer;font-weight:bold}
  button:hover{background:#A01830}
  a.secondary{display:block;margin-top:1rem;color:#1E4D8C;font-size:.85rem;text-decoration:none}
  .brand{margin-top:1.5rem;font-family:Georgia,serif;font-size:.8rem;color:#94A3B8;letter-spacing:2px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">😅</div>
  <h1>Oups, petit souci technique</h1>
  <p>Le site a eu un souci de connexion passager. Ce n'est rien de grave : appuie sur le bouton ci-dessous pour recharger la page.</p>
  <button onclick="location.reload()">🔄 Recharger la page</button>
  <a class="secondary" href="/">← Retour à l'accueil</a>
  <div class="brand">IMAGINE EVENTS · TUNISIA</div>
</div>
</body>
</html>
