{% extends "base.html" %}
{% block title %}Changer mot de passe{% endblock %}

{% block content %}
<div class="form-page" style="max-width:500px">
    <div class="breadcrumb">
        <a href="{{ url_for('dashboard') }}">← Retour au dépôt</a>
    </div>
    <div class="page-header">
        <h1>🔑 Changer le mot de passe</h1>
        <p>{{ current_user.full_name }} ({{ current_user.email }})</p>
    </div>

    <form method="POST" class="equipment-form">
        <div class="form-card">
            <div class="form-group">
                <label for="current_password">Mot de passe actuel</label>
                <input type="password" id="current_password" name="current_password" required
                       placeholder="Votre mot de passe actuel">
            </div>
            <div class="form-group">
                <label for="new_password">Nouveau mot de passe</label>
                <input type="password" id="new_password" name="new_password" required
                       placeholder="Au moins 6 caractères">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmer le nouveau mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       placeholder="Répétez le nouveau mot de passe">
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-accent btn-lg">💾 Changer le mot de passe</button>
        </div>
    </form>
</div>
{% endblock %}
