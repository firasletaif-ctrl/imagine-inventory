{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon large">✦</div>
            <h1>IMAGINE<span class="text-red"> EVENTS</span></h1>
            <p class="auth-subtitle">Gestion de Dépôt — Inventaire</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" id="email" name="email" required
                           placeholder="vous@imagine-events.com" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-pw" onclick="
                        const p = document.getElementById('password');
                        p.type = p.type === 'password' ? 'text' : 'password';
                    ">👁️</button>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Se souvenir de moi
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Se connecter
                <span class="btn-arrow">→</span>
            </button>
        </form>

        <div class="auth-footer">
            <span>Pas encore de compte ?</span>
            <a href="{{ url_for('register') }}">Créer un compte</a>
        </div>

        <div class="auth-badge">
            <span>🇹🇳 Imagine Events Tunisia</span>
        </div>
    </div>
</div>
{% endblock %}
