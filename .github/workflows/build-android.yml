name: Build APK Android (Imagine Events)

# Construction de l'APK Android de l'app Imagine Events.
# Gratuit : tourne sur GitHub Actions (pas besoin d'ordinateur special).
# Usage : bouton "Run workflow" dans l'onglet Actions de GitHub,
# puis telecharger l'APK depuis l'artifact.

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | sdkmanager --licenses --sdk_root="$ANDROID_HOME" > /dev/null 2>&1 || true

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        working-directory: mobile-app
        run: npx cap sync android

      - name: Build APK (debug, installable)
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imagine-events-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
