name: Build Logiciel PC (Imagine Events)

# Construction du logiciel PC de l'app Imagine Events.
# Gratuit : tourne sur GitHub Actions (pas besoin d'ordinateur special).
# Usage : bouton "Run workflow" dans l'onglet Actions de GitHub,
# puis telecharger les fichiers depuis les artifacts.

on:
  workflow_dispatch:
  push:
    branches: [desktop-app]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Build Windows (.exe)
        working-directory: desktop-app
        run: npx electron-builder --win

      - name: Upload installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: imagine-events-pc-windows
          path: desktop-app/dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Build Linux (AppImage)
        working-directory: desktop-app
        run: npx electron-builder --linux

      - name: Upload AppImage Linux
        uses: actions/upload-artifact@v4
        with:
          name: imagine-events-pc-linux
          path: desktop-app/dist/*.AppImage
